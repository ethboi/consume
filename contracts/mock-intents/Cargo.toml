[package]
name = "mock-intents"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Testnet stand-in for NEAR Intents (intents.near): NEP-245 balances, simulated cross-chain deposits and withdrawals"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
