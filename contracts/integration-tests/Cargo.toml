[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
# Build OpenSSL from source so the sandbox tests need no system libssl-dev / pkg-config.
openssl = { version = "0.10", features = ["vendored"] }
