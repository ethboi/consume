# Runs the checks the README lists under "Reproduce the checks" that need
# no live network: steps 1 to 5b, 9, 10, 14 and 15, plus the site's type check,
# lint and build. Steps 14 and 15 are the browser tests in web/e2e: the sample
# set, and the chain set, which starts its own site and its own NEAR sandbox.
# Nothing here holds a key to any public network, signs a transaction on one,
# or deploys.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: CONSUME unit tests
        working-directory: contracts/consume
        run: cargo test
      - name: NEAR Intents stand-in
        working-directory: contracts/mock-intents
        run: cargo test
      - name: NEP-141 stand-in
        working-directory: contracts/mock-meme
        run: cargo test

  sandbox:
    name: End to end on a NEAR sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build the three contracts
        working-directory: contracts
        run: |
          for c in consume mock-meme mock-intents; do
            (cd "$c" && cargo near build non-reproducible-wasm)
          done
      - name: Plain NEP-141 flow
        working-directory: contracts/integration-tests
        run: cargo test --test flow
      - name: NEAR Intents flow
        working-directory: contracts/integration-tests
        run: cargo test --test intents
      - name: The Feast over four weeks
        working-directory: contracts/integration-tests
        run: cargo test --test feast
      - name: A Bond sold through an approval
        working-directory: contracts/integration-tests
        run: cargo test --test sale
      - name: A price round that carries the Assayer's quotes
        working-directory: contracts/integration-tests
        run: cargo test --test round

  web:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_CHANNEL: chrome
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Embed the card fonts (pnpm dev and pnpm build do this themselves)
        run: node scripts/embed-fonts.mjs
      - name: Types
        run: pnpm exec tsc --noEmit
      - name: Web unit regressions
        run: pnpm test
      - name: Lint
        run: pnpm exec eslint src
      - name: Build
        run: pnpm build
      # The hosted runner already includes Chrome and its OS dependencies.
      # Avoid apt mirror retries and browser downloads before every test run.
      - name: Verify preinstalled Chrome
        timeout-minutes: 1
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ channel: process.env.E2E_CHANNEL, timeout: 15_000 });
          console.log(`Browser ready: Chrome ${browser.version()}`);
          await browser.close();
          JS
      - name: Browser tests, sample figures (21 tests)
        timeout-minutes: 5
        run: node e2e/run.mjs sample
      - name: Keep the screenshots and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-sample
          path: web/e2e/.run/results
          if-no-files-found: ignore

  browser-chain:
    name: Site, contract and test wallet on a NEAR sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build CONSUME and the NEAR Intents stand-in
        working-directory: contracts
        run: |
          for c in consume mock-intents; do
            (cd "$c" && cargo near build non-reproducible-wasm)
          done
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the site's packages
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Verify preinstalled Chrome
        timeout-minutes: 1
        working-directory: web
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ channel: process.env.E2E_CHANNEL, timeout: 15_000 });
          console.log(`Browser ready: Chrome ${browser.version()}`);
          await browser.close();
          JS
      - name: Browser tests on the sandbox (35 tests)
        timeout-minutes: 8
        working-directory: web
        run: node e2e/run.mjs chain
      - name: Keep the screenshots and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-chain
          path: web/e2e/.run/results
          if-no-files-found: ignore

  sim-and-agents:
    name: Simulation and MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sixty days, four scenarios (stops if the backing ever falls)
        run: node sim/sim.mjs
      - name: The run gave the figures in the repository (the README's table, the charts, the site's section)
        run: git diff --exit-code -- sim/out sim/charts web/src/lib/simulation.json
      - name: Launch arguments build from the memecoin list
        run: node scripts/launch-args.mjs --guardian ci.testnet --assayer ci.testnet --intents intents.ci.testnet > /dev/null
      - name: The MCP server answers over stdio with its 14 tools
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node agents/mcp.mjs > answers.jsonl
          node -e '
            const lines = require("fs").readFileSync("answers.jsonl", "utf8").trim().split("\n").map((l) => JSON.parse(l));
            const byId = Object.fromEntries(lines.map((l) => [l.id, l]));
            if (lines.length !== 2) throw new Error("expected 2 answers, got " + lines.length);
            if (byId[1].result.serverInfo.name !== "consume") throw new Error("wrong server name");
            const n = byId[2].result.tools.length;
            if (n !== 14) throw new Error("expected 14 tools, got " + n);
            console.log("ok:", n, "tools");
          '
